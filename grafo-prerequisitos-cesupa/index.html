<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Grafo de pré-requisitos — CESUPA | BCC e Engenharia de Computação</title>
<style>
  :root{
    --ink:#0b1220; --ink-2:#334155; --ink-3:#64748b;
    --paper:#f6f7f9; --surface:#ffffff; --line:#dfe3ea;
    --chrome:#0f172a; --chrome-2:#1e293b; --chrome-line:#293548;
    --up:#1d4ed8; --down:#c2410c; --sel:#0f172a;
    --radius:10px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  body.dark{
    --ink:#e8edf5; --ink-2:#b6c2d4; --ink-3:#8496ad;
    --paper:#0b1220; --surface:#131c2e; --line:#27324a;
    --chrome:#070c16; --chrome-2:#111a2b; --chrome-line:#1e2a40;
    --up:#60a5fa; --down:#fb923c; --sel:#e8edf5;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:var(--font);background:var(--paper);color:var(--ink);overflow:hidden;-webkit-text-size-adjust:100%}
  button{font-family:inherit;cursor:pointer}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}

  /* ---------- Barra superior ---------- */
  header{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:9px 14px;background:var(--chrome);color:#e8edf5;
    border-bottom:1px solid var(--chrome-line);position:relative;z-index:20
  }
  .brand{display:flex;flex-direction:column;line-height:1.15;margin-right:2px}
  .brand b{font-size:14px;font-weight:650;letter-spacing:-.01em}
  .brand span{font-size:10.5px;color:#8496ad;letter-spacing:.08em;text-transform:uppercase}
  .tabs{display:flex;background:var(--chrome-2);border:1px solid var(--chrome-line);border-radius:9px;padding:3px;gap:3px}
  .tabs button{
    background:transparent;border:0;color:#a7b4c8;font-size:12.5px;font-weight:600;
    padding:6px 13px;border-radius:6px;letter-spacing:.01em
  }
  .tabs button[aria-selected="true"]{background:#e8edf5;color:#0b1220}
  .search{position:relative;flex:1 1 210px;max-width:330px;min-width:170px}
  .search input{
    width:100%;padding:8px 30px 8px 32px;border-radius:8px;font-size:13px;
    background:var(--chrome-2);border:1px solid var(--chrome-line);color:#e8edf5;outline:none
  }
  .search input::placeholder{color:#64748b}
  .search input:focus{border-color:#4b5f80}
  .search svg{position:absolute;left:10px;top:9px;opacity:.55}
  .search .clear{position:absolute;right:5px;top:5px;background:none;border:0;color:#8496ad;font-size:15px;padding:2px 6px;border-radius:5px;display:none}
  .search.has .clear{display:block}
  .hits{
    position:absolute;top:38px;left:0;right:0;background:var(--surface);color:var(--ink);
    border:1px solid var(--line);border-radius:9px;max-height:270px;overflow:auto;display:none;
    box-shadow:0 12px 32px rgba(2,8,23,.28)
  }
  .hits.on{display:block}
  .hits div{padding:7px 11px;font-size:12.5px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
  .hits div:last-child{border-bottom:0}
  .hits div:hover,.hits div.cur{background:rgba(125,145,180,.14)}
  .hits em{font-style:normal;font-size:10.5px;color:var(--ink-3);margin-left:auto;white-space:nowrap}
  .tools{display:flex;gap:6px;align-items:center;margin-left:auto}
  .tool{
    background:var(--chrome-2);border:1px solid var(--chrome-line);color:#c7d2e2;
    border-radius:8px;padding:7px 10px;font-size:12px;font-weight:550;display:flex;align-items:center;gap:6px
  }
  .tool:hover{background:#243046;color:#fff}
  .tool.on{background:#e8edf5;color:#0b1220;border-color:#e8edf5}
  .zoomctl{display:flex;align-items:center;background:var(--chrome-2);border:1px solid var(--chrome-line);border-radius:8px;overflow:hidden}
  .zoomctl button{background:none;border:0;color:#c7d2e2;padding:7px 11px;font-size:14px;line-height:1}
  .zoomctl button:hover{background:#243046;color:#fff}
  .zoomctl span{font-size:11px;color:#8496ad;min-width:44px;text-align:center;font-variant-numeric:tabular-nums;font-family:var(--mono)}

  /* ---------- Layout ---------- */
  main{display:flex;height:calc(100% - 51px)}
  #stage{flex:1;position:relative;overflow:hidden;background:var(--paper);touch-action:none}
  #svg{width:100%;height:100%;display:block;cursor:grab;user-select:none;-webkit-user-select:none}
  #svg.grabbing{cursor:grabbing}

  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:0 4px 18px rgba(2,8,23,.10);pointer-events:auto
  }
  .mini{position:absolute;right:12px;bottom:12px;padding:9px 10px;width:236px;pointer-events:auto}
  .mini h4{margin:0 0 7px;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
  .periods{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:9px}
  .periods button{
    min-width:25px;height:23px;padding:0 5px;border:1px solid var(--line);background:none;border-radius:6px;
    font-size:11px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums
  }
  .periods button:hover{background:rgba(125,145,180,.16);color:var(--ink)}
  .tip b{color:var(--ink-2);font-weight:600}
  .tip{margin:8px 0 0;font-size:10.5px;line-height:1.55;color:var(--ink-3)}
  #mapbox{display:block;width:100%;border:1px solid var(--line);border-radius:7px;background:var(--paper);cursor:crosshair}
  .vp{fill:rgba(37,99,235,.13);stroke:var(--up);stroke-width:14;vector-effect:non-scaling-stroke}
  .key{display:inline-block;padding:1px 5px;border:1px solid var(--line);border-radius:4px;font-family:var(--mono);font-size:9.5px;color:var(--ink-2)}

  /* ---------- Painel lateral ---------- */
  aside{
    width:352px;flex:none;background:var(--surface);border-left:1px solid var(--line);
    display:flex;flex-direction:column;overflow:hidden
  }
  aside.hide{display:none}
  .ptabs{display:flex;border-bottom:1px solid var(--line);flex:none}
  .ptabs button{
    flex:1;background:none;border:0;padding:11px 8px;font-size:12px;font-weight:600;color:var(--ink-3);
    border-bottom:2px solid transparent
  }
  .ptabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--sel)}
  .pbody{overflow:auto;padding:16px;flex:1}
  .pane{display:none}.pane.on{display:block}

  .empty{color:var(--ink-3);font-size:12.5px;line-height:1.65;padding:26px 4px}
  .empty b{color:var(--ink-2)}

  .dtitle{font-size:17px;font-weight:650;line-height:1.28;letter-spacing:-.015em;margin:0 0 8px}
  .dchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .chip{font-size:10.5px;padding:3px 8px;border-radius:20px;border:1px solid var(--line);color:var(--ink-2);display:flex;align-items:center;gap:5px}
  .chip i{width:7px;height:7px;border-radius:50%}

  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
  .stat{border:1px solid var(--line);border-radius:9px;padding:9px 10px}
  .stat b{display:block;font-size:20px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .stat span{font-size:10px;color:var(--ink-3);letter-spacing:.03em;text-transform:uppercase;font-weight:600}
  .stat.up b{color:var(--up)} .stat.down b{color:var(--down)}

  .sect{margin-bottom:16px}
  .sect h5{
    font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
    margin:0 0 8px;font-weight:700;display:flex;align-items:center;gap:7px
  }
  .sect h5 s{flex:1;height:1px;background:var(--line);text-decoration:none}
  .list{display:flex;flex-direction:column;gap:3px}
  .item{
    display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;font-size:12.5px;
    background:none;border:0;width:100%;text-align:left;color:var(--ink-2);line-height:1.35
  }
  .item:hover{background:rgba(125,145,180,.14);color:var(--ink)}
  .item i{width:3px;align-self:stretch;border-radius:2px;flex:none}
  .item em{font-style:normal;font-size:10px;color:var(--ink-3);margin-left:auto;font-family:var(--mono);white-space:nowrap}
  .orbox{border:1px dashed var(--line);border-radius:8px;padding:5px 6px;margin-bottom:3px}
  .orbox .ortag{font-size:9.5px;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding:0 4px 3px}
  .note{
    font-size:11.5px;line-height:1.6;color:var(--ink-2);background:rgba(180,83,9,.09);
    border-left:2px solid #b45309;border-radius:0 7px 7px 0;padding:9px 11px;margin-bottom:14px
  }
  .note b{display:block;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:#b45309;margin-bottom:3px}
  .bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:5px}
  .bar i{display:block;height:100%;border-radius:3px}
  .rank{display:flex;flex-direction:column;gap:9px}
  .rank .r{font-size:12px;color:var(--ink-2)}
  .rank .r span{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .rank .r b{font-family:var(--mono);font-size:11px;color:var(--ink-3);font-weight:500}
  .rank .r u{text-decoration:none;cursor:pointer}
  .rank .r u:hover{text-decoration:underline}

  /* ---------- Responsivo ---------- */
  @media (max-width:860px){
    main{flex-direction:column}
    aside{width:100%;height:44%;border-left:0;border-top:1px solid var(--line)}
    .brand{display:none}
      }
  @media (max-width:700px){
      .mini{left:8px;right:8px;bottom:8px;width:auto;padding:7px 8px}
    .mini h4,#mapbox,.tip{display:none}
    .periods{flex-wrap:nowrap;overflow-x:auto;margin-bottom:0;-webkit-overflow-scrolling:touch}
    .periods button{flex:none}
    header{gap:8px;padding:8px 10px}
    .tools{gap:5px}
  }
  @media print{
    header,aside,.mini{display:none!important}
    main{height:100%}
  }
</style>
</head>
<body>

<header>
  <div class="brand"><b>Grafo de pré-requisitos</b><span>CESUPA · Matriz curricular</span></div>

  <div class="tabs" role="tablist" id="courseTabs"></div>

  <div class="search" id="searchWrap">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="text" placeholder="Buscar disciplina…  ( / )" autocomplete="off" spellcheck="false">
    <button class="clear" id="qclear" title="Limpar">×</button>
    <div class="hits" id="hits"></div>
  </div>

  <div class="tools">
    <button class="tool" id="focusBtn" title="Ao selecionar, esconde tudo que não faz parte da cadeia (F)">Foco</button>
    <div class="zoomctl">
      <button id="zout" title="Menos zoom (−)">−</button>
      <span id="zlvl">100%</span>
      <button id="zin" title="Mais zoom (+)">+</button>
    </div>
    <button class="tool" id="fitBtn" title="Ajustar à tela (0)">Ajustar</button>
    <button class="tool" id="pngBtn" title="Baixar imagem PNG em alta resolução">PNG</button>
    <button class="tool" id="svgBtn" title="Baixar vetor SVG">SVG</button>
    <button class="tool" id="themeBtn" title="Alternar tema claro/escuro">◐</button>
    <button class="tool" id="asideBtn" title="Mostrar/ocultar painel">☰</button>
  </div>
</header>

<main>
  <div id="stage">
    <svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="card mini" id="mini">
      <h4>Ir para o período</h4>
      <div class="periods" id="periods"></div>
      <svg id="mapbox"></svg>
      <p class="tip">Clique: mostra a cadeia · <b>Duplo clique: isola e aproxima</b> · Rolagem: zoom · Arrastar: mover · <span class="key">esc</span>: limpar</p>
    </div>
  </div>

  <aside id="aside">
    <div class="ptabs" role="tablist">
      <button role="tab" aria-selected="true" data-pane="detail">Disciplina</button>
      <button role="tab" aria-selected="false" data-pane="overview">Visão do curso</button>
    </div>
    <div class="pbody">
      <div class="pane on" id="pane-detail"></div>
      <div class="pane" id="pane-overview"></div>
    </div>
  </aside>
</main>

/* ====================== CONSTANTES DE LAYOUT ====================== */
const NW = 232, PADX = 13, LINE_H = 16, PAD_TOP = 12, META_H = 20, PAD_BOT = 10;
const COL_GAP = 74, ROW_GAP = 14, BAND_PAD = 20, TOP_PAD = 88;
const MIN_H = 68;

/* ====================== ESTADO ====================== */
const S = { course:null, nodes:[], byName:{}, edges:[], W:0, H:0,
            k:1, tx:0, ty:0, sel:null, focus:false, offAxes:new Set(), hits:new Set() };

const svg = document.getElementById('svg');
const focusBtn = document.getElementById('focusBtn');
const stage = document.getElementById('stage');
let gRoot, gEdges, gNodes;

/* ---------- medição de texto ---------- */
const mctx = document.createElement('canvas').getContext('2d');
const FONT_SM = '600 12.5px -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif';
const FONT_LG = '650 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif';
mctx.font = '600 12.5px -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif';
function wrap(text, maxW, maxLines){
  const words = text.split(' '); const lines = []; let cur = '';
  for (const w of words){
    const t = cur ? cur + ' ' + w : w;
    if (mctx.measureText(t).width <= maxW || !cur) cur = t;
    else { lines.push(cur); cur = w; }
  }
  if (cur) lines.push(cur);
  if (lines.length > maxLines){
    const keep = lines.slice(0, maxLines);
    let last = keep[maxLines-1];
    while (mctx.measureText(last + '…').width > maxW && last.length > 4) last = last.slice(0,-1);
    keep[maxLines-1] = last.replace(/[ ,]$/,'') + '…';
    return keep;
  }
  return lines;
}

/* ====================== CONSTRUÇÃO DO GRAFO ====================== */
function build(courseKey){
  const c = DATA[courseKey];
  S.course = courseKey; S.sel = null; S.hits = new Set(); S.offAxes = new Set();

  S.nodes = c.disciplines.map((d,i) => {
    mctx.font = FONT_SM;
    const lines = wrap(d.n, NW - PADX*2 - 6, 3);
    mctx.font = FONT_LG;
    const farLines = wrap(d.n, NW - PADX*2 - 6, 3);
    mctx.font = FONT_SM;
    return { id:i, name:d.n, p:d.p, ax:d.ax, color:c.axes[d.ax], obs:d.obs||null,
             groups:d.pre, lines, farLines, w:NW,
             h: Math.max(MIN_H, PAD_TOP + lines.length*LINE_H + META_H + PAD_BOT,
                         PAD_TOP + farLines.length*18 + PAD_BOT),
             pre:[], suc:[], preGroups:[], x:0, y:0 };
  });
  S.byName = {}; S.nodes.forEach(n => S.byName[n.name] = n);

  S.edges = [];
  S.nodes.forEach(n => {
    n.preGroups = n.groups.map(g => g.map(name => S.byName[name].id));
    n.groups.forEach(g => {
      const or = g.length > 1;
      g.forEach(name => {
        const s = S.byName[name];
        S.edges.push({ s:s.id, t:n.id, or });
        if (!n.pre.includes(s.id)) n.pre.push(s.id);
        if (!s.suc.includes(n.id)) s.suc.push(n.id);
      });
    });
  });

  computeReach();
  layout(c);
  render(c);
  buildMinimap();
  buildPeriods(c);
  renderOverview(c);
  showEmptyDetail(c);
  requestAnimationFrame(() => {
    if (stage.getBoundingClientRect().width < 700) zoomToPeriod(1); else fit();
  });
}

/* ancestrais / descendentes (memoizados) */
function computeReach(){
  const anc = S.nodes.map(()=>null), des = S.nodes.map(()=>null);
  const goA = i => { if (anc[i]) return anc[i]; const s = new Set(); anc[i]=s;
    S.nodes[i].pre.forEach(p => { s.add(p); goA(p).forEach(x=>s.add(x)); }); return s; };
  const goD = i => { if (des[i]) return des[i]; const s = new Set(); des[i]=s;
    S.nodes[i].suc.forEach(p => { s.add(p); goD(p).forEach(x=>s.add(x)); }); return s; };
  S.nodes.forEach((n,i) => { n.anc = goA(i); n.des = goD(i); });
  // profundidade = maior caminho até uma disciplina de entrada
  const dep = S.nodes.map(()=>-1);
  const goDep = i => { if (dep[i] >= 0) return dep[i]; dep[i]=0;
    dep[i] = S.nodes[i].pre.length ? 1 + Math.max(...S.nodes[i].pre.map(goDep)) : 0; return dep[i]; };
  S.nodes.forEach((n,i) => n.depth = goDep(i));
}

/* ---------- posicionamento em camadas + baricentro ---------- */
function layout(c){
  const cols = [];
  for (let p = 1; p <= c.periods; p++) cols.push(S.nodes.filter(n => n.p === p));

  const stack = col => {
    let y = 0;
    col.forEach(n => { n.y = y; y += n.h + ROW_GAP; });
    return y - ROW_GAP;
  };
  cols.forEach(stack);

  const center = n => n.y + n.h/2;
  for (let it = 0; it < 14; it++){
    const dir = it % 2 === 0;
    const order = dir ? cols : [...cols].reverse();
    order.forEach((col, ci) => {
      if ((dir && ci === 0) || (!dir && ci === 0)) return;
      col.forEach(n => {
        const nb = dir ? n.pre : n.suc;
        n._bc = nb.length ? nb.reduce((a,b)=>a+center(S.nodes[b]),0)/nb.length : center(n);
      });
      col.sort((a,b) => (a._bc - b._bc) || (a.id - b.id));
      stack(col);
    });
  }

  const heights = cols.map(col => col.reduce((a,n)=>a+n.h+ROW_GAP,0) - ROW_GAP);
  const maxH = Math.max(...heights);
  cols.forEach((col, i) => {
    const off = (maxH - heights[i]) / 2;
    const x = i * (NW + COL_GAP);
    col.forEach(n => { n.x = x; n.y += off + TOP_PAD; });
    col.band = { x: x - BAND_PAD, w: NW + BAND_PAD*2, p: i+1 };
  });
  S.cols = cols;
  S.W = c.periods * (NW + COL_GAP) - COL_GAP + BAND_PAD*2;
  S.H = maxH + TOP_PAD + 60;
}

/* ---------- desenho ---------- */
const NS = 'http://www.w3.org/2000/svg';
const el = (t, a={}) => { const e = document.createElementNS(NS, t);
  for (const k in a) e.setAttribute(k, a[k]); return e; };

function arrow(id, cls){
  const m = el('marker', { id, viewBox:'0 0 10 10', refX:'9', refY:'5',
    markerWidth:'6.5', markerHeight:'6.5', orient:'auto-start-reverse' });
  m.appendChild(el('path', { d:'M0,0.6 L10,5 L0,9.4 z', class:cls }));
  return m;
}

function render(c){
  svg.textContent = '';
  const defs = el('defs');
  const st = el('style'); st.textContent = GRAPH_CSS + (document.body.classList.contains('dark') ? GRAPH_CSS_DARK : '');
  defs.appendChild(st);
  const mk = (id, color) => { const m = arrow(id); m.firstChild.setAttribute('fill', color); return m; };
  defs.appendChild(mk('ar', 'var(--edge)'));
  defs.appendChild(mk('ar-up', 'var(--up)'));
  defs.appendChild(mk('ar-down', 'var(--down)'));
  svg.appendChild(defs);

  gRoot = el('g', { class:'canvas' + (document.body.classList.contains('dark') ? ' dark' : '') });
  svg.appendChild(gRoot);

  const gBands = el('g'); gRoot.appendChild(gBands);
  gEdges = el('g'); gRoot.appendChild(gEdges);
  gNodes = el('g'); gRoot.appendChild(gNodes);

  S.cols.forEach((col, i) => {
    const b = col.band;
    gBands.appendChild(el('rect', { class:'band' + (i%2 ? ' alt' : ''),
      x:b.x, y:0, width:b.w, height:S.H, rx:14 }));
    const t1 = el('text', { class:'hdrnum', x:b.x + 16, y:52 }); t1.textContent = i+1 + 'º';
    const t2 = el('text', { class:'hdrtxt', x:b.x + 16, y:70 }); t2.textContent = 'PERÍODO';
    gBands.appendChild(t1); gBands.appendChild(t2);
  });

  S.edges.forEach((e, i) => {
    const a = S.nodes[e.s], b = S.nodes[e.t];
    const x1 = a.x + a.w, y1 = a.y + a.h/2, x2 = b.x - 6, y2 = b.y + b.h/2;
    const dx = Math.max(38, (x2 - x1) * 0.44);
    const p = el('path', { class:'edge' + (e.or ? ' or' : ''),
      d:`M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}` });
    p.dataset.s = e.s; p.dataset.t = e.t; e.el = p;
    gEdges.appendChild(p);
  });

  S.nodes.forEach(n => {
    const g = el('g', { class:'node', transform:`translate(${n.x},${n.y})` });
    g.dataset.id = n.id;
    g.appendChild(el('rect', { class:'nbox', width:n.w, height:n.h, rx:11 }));
    g.appendChild(el('rect', { class:'nbar', x:0, y:10, width:4.5, height:n.h-20, rx:2.5, fill:n.color }));
    const t = el('text', { class:'nlabel' });
    n.lines.forEach((ln, i) => {
      const ts = el('tspan', { x:PADX, y:PAD_TOP + 12 + i*LINE_H }); ts.textContent = ln; t.appendChild(ts);
    });
    g.appendChild(t);
    const tf = el('text', { class:'nlabel-far' });
    n.farLines.forEach((ln, i) => {
      const ts = el('tspan', { x:PADX, y: (n.h - n.farLines.length*18)/2 + 14 + i*18 });
      ts.textContent = ln; tf.appendChild(ts);
    });
    g.appendChild(tf);
    const meta = el('text', { class:'nmeta', x:PADX, y:n.h - PAD_BOT - 3 });
    const nPre = n.pre.length, nSuc = n.suc.length;
    meta.textContent = (nPre ? nPre + (nPre>1?' pré-req':' pré-req') : 'sem pré-requisito') + (nSuc ? '  ·  abre ' + nSuc : '');
    g.appendChild(meta);
    n.el = g;
    g.addEventListener('click', ev => { ev.stopPropagation(); select(n.id); });
    g.addEventListener('dblclick', ev => { ev.stopPropagation(); ev.preventDefault(); isolate(n.id); });
    g.addEventListener('mouseenter', () => { if (S.sel === null) hover(n.id); });
    g.addEventListener('mouseleave', () => { if (S.sel === null) hover(null); });
    gNodes.appendChild(g);
  });

  applyTransform();
}

/* ====================== INTERAÇÃO ====================== */
function paint(){
  const sel = S.sel;
  const axOff = S.offAxes;
  S.nodes.forEach(n => {
    const cl = n.el.classList;
    cl.remove('up','down','sel','mute','gone','hit');
    if (axOff.has(n.ax)) { cl.add('gone'); return; }
    if (S.hits.size && S.hits.has(n.id)) cl.add('hit');
    if (sel === null){ if (S.hits.size && !S.hits.has(n.id)) cl.add('mute'); return; }
    const s = S.nodes[sel];
    if (n.id === sel) cl.add('sel');
    else if (s.anc.has(n.id)) cl.add('up');
    else if (s.des.has(n.id)) cl.add('down');
    else cl.add(S.focus ? 'gone' : 'mute');
  });
  S.edges.forEach(e => {
    const cl = e.el.classList;
    cl.remove('up','down','mute','gone');
    const a = S.nodes[e.s], b = S.nodes[e.t];
    if (axOff.has(a.ax) || axOff.has(b.ax)) { cl.add('gone'); return; }
    if (sel === null) { if (S.hits.size) cl.add('mute'); return; }
    const s = S.nodes[sel];
    const inUp = (e.t === sel || s.anc.has(e.t)) && (s.anc.has(e.s));
    const inDown = (e.s === sel || s.des.has(e.s)) && (s.des.has(e.t));
    if (inUp) cl.add('up');
    else if (inDown) cl.add('down');
    else cl.add(S.focus ? 'gone' : 'mute');
  });
}

function hover(id){
  if (id === null){ paint(); return; }
  const n = S.nodes[id];
  S.nodes.forEach(m => { const cl = m.el.classList; cl.remove('up','down','mute');
    if (S.offAxes.has(m.ax)) return;
    if (m.id === id) return;
    if (n.pre.includes(m.id)) cl.add('up');
    else if (n.suc.includes(m.id)) cl.add('down');
  });
  S.edges.forEach(e => { const cl = e.el.classList; cl.remove('up','down','mute');
    if (e.t === id) cl.add('up'); else if (e.s === id) cl.add('down');
  });
}

function setSel(id){
  S.sel = id;
  paint();
  renderDetail(S.nodes[id]);
  switchPane('detail');
}

/* duplo clique: isola a cadeia e enquadra */
function isolate(id){
  setSel(id);
  if (!S.focus){ S.focus = true; focusBtn.classList.add('on'); paint(); }
  fitChain(id);
}
function fitChain(id){
  const n = S.nodes[id];
  const ids = [id, ...n.anc, ...n.des].map(i => S.nodes[i]);
  const x1 = Math.min(...ids.map(m => m.x)), x2 = Math.max(...ids.map(m => m.x + m.w));
  const y1 = Math.min(...ids.map(m => m.y)), y2 = Math.max(...ids.map(m => m.y + m.h));
  const r = stage.getBoundingClientRect(), pad = 70;
  const k = clampK(Math.min(1.15, (r.width - pad*2)/(x2-x1), (r.height - pad*2)/(y2-y1)));
  S.k = k;
  S.tx = r.width/2 - (x1+x2)/2*k;
  S.ty = r.height/2 - (y1+y2)/2*k;
  applyTransform();
}

function select(id){
  S.sel = (S.sel === id) ? null : id;
  paint();
  if (S.sel === null) showEmptyDetail(DATA[S.course]); else renderDetail(S.nodes[S.sel]);
  switchPane('detail');
}

function renderOverview(c){
  const entry = S.nodes.filter(n => !n.pre.length);

  paneOver.innerHTML = `

      <h5>Maior gargalo — trava mais disciplinas<s></s></h5>

        <div class="r"><span><u data-go="${n.id}">${esc(n.name)}</u><b>${n.des.size}</b></span>

    </div>
    <div class="sect">
      <h5>Cadeia crítica — ${chain.length} disciplinas em sequência<s></s></h5>
      <div class="list">${chain.map((n,i)=>itemBtn(n, 'nível ' + n.depth)).join('')}</div>
    </div>
    <div class="sect">
      <h5>Mais dependente — exige mais histórico<s></s></h5>
      <div class="list">${heavy.map(n=>itemBtn(n, n.anc.size + ' antes')).join('')}</div>
    </div>
    <div class="sect">
      <h5>Entradas sem pré-requisito<s></s>${entry.length}</h5>
      <div class="list">${entry.map(n=>itemBtn(n)).join('')}</div>
    </div>
    <div class="sect">
      <h5>Pontas da matriz — nada depende delas<s></s>${leaf.length}</h5>
      <div class="list">${leaf.map(n=>itemBtn(n)).join('')}</div>
    </div>
    ${orNodes.length ? `<div class="sect">
      <h5>Com pré-requisito alternativo (ou)<s></s>${orNodes.length}</h5>
      <div class="list">${orNodes.map(n=>itemBtn(n)).join('')}</div></div>` : ''}
    ${notes.length ? `<div class="sect">
      <h5>Pontos de atenção<s></s>${notes.length}</h5>
      ${notes.map(n=>`<div class="note"><b>${esc(n.name)}</b>${esc(n.obs)}</div>`).join('')}</div>` : ''}`;

/* ====================== ZOOM / PAN ====================== */
function applyTransform(){
  gRoot.setAttribute('transform', `translate(${S.tx},${S.ty}) scale(${S.k})`);
  document.getElementById('zlvl').textContent = Math.round(S.k*100) + '%';
  gRoot.classList.toggle('far', S.k < 0.62);
  updateMinimap();
}

/* ---------- minimapa ---------- */
const mapbox = document.getElementById('mapbox');
let vpRect = null;
function buildMinimap(){
  const h = Math.round(214 * S.H / S.W);
  mapbox.setAttribute('viewBox', `${-BAND_PAD} 0 ${S.W} ${S.H}`);
  mapbox.setAttribute('height', Math.max(46, h));
  mapbox.textContent = '';
  S.nodes.forEach(n => mapbox.appendChild(el('rect', {
    x:n.x, y:n.y, width:n.w, height:n.h, rx:6, fill:n.color, opacity:.5 })));
  vpRect = el('rect', { class:'vp', rx:8 });
  mapbox.appendChild(vpRect);
}
function updateMinimap(){
  if (!vpRect) return;
  const r = stage.getBoundingClientRect();
  vpRect.setAttribute('x', -S.tx / S.k);
  vpRect.setAttribute('y', -S.ty / S.k);
  vpRect.setAttribute('width', r.width / S.k);
  vpRect.setAttribute('height', r.height / S.k);
}
mapbox.addEventListener('click', e => {
  const b = mapbox.getBoundingClientRect();
  const wx = -BAND_PAD + (e.clientX - b.left) / b.width * S.W;
  const wy = (e.clientY - b.top) / b.height * S.H;
  const r = stage.getBoundingClientRect();
  S.tx = r.width/2 - wx*S.k; S.ty = r.height/2 - wy*S.k;
  applyTransform();
});
function zoomToPeriod(p){
  const col = S.cols[p-1]; if (!col || !col.length) return;
  const r = stage.getBoundingClientRect();
  const top = Math.min(...col.map(n=>n.y)), bot = Math.max(...col.map(n=>n.y+n.h));
  const k = clampK(Math.min(1.15, (r.height - 60) / (bot - top + 60), (r.width - 80) / (NW + COL_GAP*1.6)));
  S.k = k;
  S.tx = r.width/2 - (col[0].x + NW/2)*k;
  S.ty = r.height/2 - ((top+bot)/2)*k;
  applyTransform();
}
function buildPeriods(c){
  const box = document.getElementById('periods');
  box.innerHTML = '';
  for (let i=1;i<=c.periods;i++){
    const b = document.createElement('button');
    b.textContent = i + 'º'; b.title = i + 'º período';
    b.onclick = () => zoomToPeriod(i);
    box.appendChild(b);
  }
}
function clampK(k){ return Math.min(3.2, Math.max(0.12, k)); }
function zoomAt(cx, cy, factor){
  const k2 = clampK(S.k * factor);
  const r = k2 / S.k;
  S.tx = cx - (cx - S.tx) * r; S.ty = cy - (cy - S.ty) * r; S.k = k2;
  applyTransform();
}
function fit(){
  const r = stage.getBoundingClientRect();
  const pad = 46;
  const k = clampK(Math.min((r.width - pad*2)/S.W, (r.height - pad*2)/S.H));
  S.k = k;
  S.tx = (r.width - S.W*k)/2 + BAND_PAD*k;
  S.ty = (r.height - S.H*k)/2;
  applyTransform();
}
function centerOn(id){
  const n = S.nodes[id], r = stage.getBoundingClientRect();
  const k = Math.max(S.k, 0.72);
  S.k = k;
  S.tx = r.width/2 - (n.x + n.w/2)*k;
  S.ty = r.height/2 - (n.y + n.h/2)*k;
  applyTransform();
}

let drag = null, pointers = new Map(), pinch = null;
svg.addEventListener('pointerdown', e => {
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (pointers.size === 2){
    const [a,b] = [...pointers.values()];
    pinch = { d: Math.hypot(a.x-b.x, a.y-b.y) };
    try { svg.setPointerCapture(e.pointerId); } catch(_){}
    drag = null;
  } else {
    drag = { x:e.clientX, y:e.clientY, tx:S.tx, ty:S.ty, moved:false, id:e.pointerId };
  }
});
svg.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (pinch && pointers.size === 2){
    const [a,b] = [...pointers.values()];
    const d = Math.hypot(a.x-b.x, a.y-b.y);
    const r = stage.getBoundingClientRect();
    zoomAt((a.x+b.x)/2 - r.left, (a.y+b.y)/2 - r.top, d/pinch.d);
    pinch.d = d;
    return;
  }
  if (drag){
    if (!drag.moved && Math.abs(e.clientX-drag.x) + Math.abs(e.clientY-drag.y) > 4){
      drag.moved = true;
      svg.classList.add('grabbing');
      try { svg.setPointerCapture(drag.id); } catch(_){}
    }
    if (!drag.moved) return;
    S.tx = drag.tx + (e.clientX - drag.x);
    S.ty = drag.ty + (e.clientY - drag.y);
    applyTransform();
  }
});
const endPtr = e => { pointers.delete(e.pointerId); if (pointers.size < 2) pinch = null;
  if (pointers.size === 0){ drag = null; svg.classList.remove('grabbing'); } };
svg.addEventListener('pointerup', endPtr);
svg.addEventListener('pointercancel', endPtr);
svg.addEventListener('wheel', e => {
  e.preventDefault();
  const r = stage.getBoundingClientRect();
  const f = Math.exp(-e.deltaY * (e.ctrlKey ? 0.012 : 0.0022));
  zoomAt(e.clientX - r.left, e.clientY - r.top, f);
}, { passive:false });
svg.addEventListener('click', () => { if (drag && drag.moved) return;
  if (S.sel !== null){ S.sel = null; paint(); showEmptyDetail(DATA[S.course]); } });

svg.addEventListener('dblclick', () => {
  S.sel = null;
  if (S.focus){ S.focus = false; focusBtn.classList.remove('on'); }
  paint(); showEmptyDetail(DATA[S.course]); fit();
});

document.getElementById('zin').onclick = () => { const r = stage.getBoundingClientRect(); zoomAt(r.width/2, r.height/2, 1.25); };
document.getElementById('zout').onclick = () => { const r = stage.getBoundingClientRect(); zoomAt(r.width/2, r.height/2, 0.8); };
document.getElementById('fitBtn').onclick = fit;

/* ====================== BUSCA ====================== */
const q = document.getElementById('q'), hits = document.getElementById('hits');
const wrapEl = document.getElementById('searchWrap');
const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
let curHit = -1, hitList = [];

function runSearch(){
  const v = norm(q.value.trim());
  wrapEl.classList.toggle('has', !!v);
  if (!v){ S.hits = new Set(); hits.classList.remove('on'); paint(); return; }
  hitList = S.nodes.filter(n => norm(n.name).includes(v)).slice(0, 12);
  S.hits = new Set(hitList.map(n => n.id));
  hits.innerHTML = hitList.length
    ? hitList.map((n,i) => `<div data-id="${n.id}" class="${i===0?'cur':''}">
        <i style="width:8px;height:8px;border-radius:3px;background:${n.color};flex:none"></i>
        ${esc(n.name)}<em>${n.p}º per.</em></div>`).join('')
    : `<div style="color:var(--ink-3)">Nenhuma disciplina encontrada.</div>`;
  curHit = 0;
  hits.classList.add('on');
  hits.querySelectorAll('[data-id]').forEach(d => d.addEventListener('click', () => {
    const id = +d.dataset.id; select(id); centerOn(id); hits.classList.remove('on');
  }));
  paint();
}
q.addEventListener('input', runSearch);
q.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ q.value = ''; runSearch(); q.blur(); }
  if (!hitList.length) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    e.preventDefault();
    curHit = (curHit + (e.key === 'ArrowDown' ? 1 : -1) + hitList.length) % hitList.length;
    hits.querySelectorAll('div').forEach((d,i) => d.classList.toggle('cur', i === curHit));
  }
  if (e.key === 'Enter'){
    const n = hitList[Math.max(0,curHit)];
    if (n){ select(n.id); centerOn(n.id); hits.classList.remove('on'); q.blur(); }
  }
});
document.getElementById('qclear').onclick = () => { q.value=''; runSearch(); q.focus(); };
document.addEventListener('click', e => { if (!wrapEl.contains(e.target)) hits.classList.remove('on'); });

/* --------- exportação --------- */
function serialize(){
  const c = DATA[S.course];
  const TOP = 74;
  const clone = svg.cloneNode(true);
  clone.setAttribute('viewBox', `${-BAND_PAD} ${-TOP} ${S.W} ${S.H + TOP}`);
  clone.setAttribute('width', S.W); clone.setAttribute('height', S.H + TOP);
  const g = clone.querySelector('.canvas');
  g.removeAttribute('transform');
  clone.querySelectorAll('.mute').forEach(x => x.classList.remove('mute'));
  const dark = document.body.classList.contains('dark');
  const bg = document.createElementNS(NS,'rect');
  bg.setAttribute('x',-BAND_PAD); bg.setAttribute('y',-TOP);
  bg.setAttribute('width',S.W); bg.setAttribute('height',S.H + TOP);
  bg.setAttribute('fill', dark ? '#0b1220' : '#f6f7f9');
  clone.insertBefore(bg, clone.querySelector('.canvas'));

  const mk = (txt, y, size, weight, fill, ls) => {
    const t = document.createElementNS(NS,'text');
    t.setAttribute('x', -BAND_PAD + 26); t.setAttribute('y', y);
    t.setAttribute('font-family','-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif');
    t.setAttribute('font-size', size); t.setAttribute('font-weight', weight);
    t.setAttribute('fill', fill); if (ls) t.setAttribute('letter-spacing', ls);
    t.textContent = txt; return t;
  };
  clone.appendChild(mk('Grafo de pré-requisitos · ' + c.label, -TOP + 34, 25, 700, dark ? '#e8edf5' : '#0b1220', '-0.4'));
  clone.appendChild(mk('CESUPA · ' + S.nodes.length + ' disciplinas · ' + S.edges.length +
    ' dependências · linha cheia = pré-requisito obrigatório (e) · linha tracejada = alternativa (ou)',
    -TOP + 55, 12.5, 500, dark ? '#8496ad' : '#64748b'));
  return new XMLSerializer().serializeToString(clone);
}
function dl(blob, name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}
document.getElementById('svgBtn').onclick = () =>
  dl(new Blob([serialize()], {type:'image/svg+xml'}), `grafo-prerequisitos-${S.course}.svg`);
document.getElementById('pngBtn').onclick = () => {
  const src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(serialize())));
  const img = new Image();
  img.onload = () => {
    const sc = 2;
    const cv = document.createElement('canvas');
    cv.width = S.W*sc; cv.height = (S.H+74)*sc;
    const cx = cv.getContext('2d'); cx.scale(sc, sc);
    cx.drawImage(img, 0, 0, S.W, S.H+74);
    cv.toBlob(b => dl(b, `grafo-prerequisitos-${S.course}.png`));
  };
  img.src = src;
};

const tabsEl = document.getElementById('courseTabs');
